<div class="container mt-5">
  <div class="card shadow p-4">
    <h1 class="mb-4 text-primary">📚 Catálogo de libros</h1>

    <div *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <form (ngSubmit)="guardarLibro()" class="row g-3 mb-4">
      <div class="col-md-3">
        <input type="text" [(ngModel)]="nuevoLibro.titulo" name="titulo" placeholder="Título" class="form-control" required>
      </div>
      <div class="col-md-3">
        <input type="text" [(ngModel)]="nuevoLibro.autor" name="autor" placeholder="Autor" class="form-control" required>
      </div>
      <div class="col-md-2">
        <input type="text" [(ngModel)]="nuevoLibro.genero" name="genero" placeholder="Género" class="form-control">
      </div>
      <div class="col-md-2">
        <input type="number" [(ngModel)]="nuevoLibro.anio" name="anio" placeholder="Año" class="form-control" required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn w-100" [ngClass]="libroEditandoId ? 'btn-primary' : 'btn-success'" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : (libroEditandoId ? 'Actualizar' : 'Guardar') }}
        </button>
      </div>
      <div class="col-12" *ngIf="libroEditandoId">
        <button type="button" class="btn btn-secondary" (click)="cancelarEdicion()">Cancelar edición</button>
      </div>
    </form>

    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Título</th>
          <th>Autor</th>
          <th>Género</th>
          <th>Año</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let libro of libros">
          <td>{{ libro.titulo || libro.title }}</td>
          <td>{{ libro.autor || libro.author }}</td>
          <td>{{ libro.genero || libro.genre }}</td>
          <td>{{ libro.anio || libro.published_year }}</td>
          <td>
            <button (click)="editar(libro)" class="btn btn-warning btn-sm me-2">Editar</button>
            <button (click)="borrar(libro._id || libro.id)" class="btn btn-danger btn-sm">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="libros.length === 0">
          <td colspan="5" class="text-center text-muted">No hay libros registrados aún.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
